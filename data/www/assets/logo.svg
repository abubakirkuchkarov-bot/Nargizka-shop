<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Nargizka Shop">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e9bd"/>
      <stop offset=".42" stop-color="#d6b25e"/>
      <stop offset=".7" stop-color="#a47d2c"/>
      <stop offset="1" stop-color="#f2dd9e"/>
    </linearGradient>
    <path id="arcTop" d="M 34 120 A 86 86 0 0 1 206 120"/>
    <path id="arcBottom" d="M 23 120 A 97 97 0 0 0 217 120"/>
  </defs>

  <circle cx="120" cy="120" r="118" fill="#0b0b0c"/>
  <circle cx="120" cy="120" r="111" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="120" cy="120" r="106" fill="none" stroke="url(#gold)" stroke-width=".6"/>
  <circle cx="120" cy="120" r="70" fill="none" stroke="url(#gold)" stroke-width="1"/>

  <text font-family="Didot, 'Bodoni MT', 'Playfair Display', Georgia, serif" font-size="17" letter-spacing="7" fill="url(#gold)">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">NARGIZKA</textPath>
  </text>
  <text font-family="Didot, 'Bodoni MT', 'Playfair Display', Georgia, serif" font-size="10" letter-spacing="4" fill="url(#gold)">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">SHOP &#183; MAISON DE ROBES</textPath>
  </text>

  <polygon points="32,114 36,120 32,126 28,120" fill="url(#gold)"/>
  <polygon points="208,114 212,120 208,126 204,120" fill="url(#gold)"/>

  <!-- crown -->
  <path d="M105 81 L102 66 L112 73 L120 61 L128 73 L138 66 L135 81 Z" fill="url(#gold)"/>
  <circle cx="102" cy="64" r="2.2" fill="url(#gold)"/>
  <circle cx="120" cy="59" r="2.4" fill="url(#gold)"/>
  <circle cx="138" cy="64" r="2.2" fill="url(#gold)"/>
  <rect x="104" y="83.5" width="32" height="2" fill="url(#gold)"/>

  <!-- N monogram: the diagonal flares like a gown hem, with a belt at the waist -->
  <rect x="94" y="94" width="3.5" height="62" fill="url(#gold)"/>
  <rect x="86" y="92" width="17" height="2.5" fill="url(#gold)"/>
  <rect x="86" y="155.5" width="19" height="2.5" fill="url(#gold)"/>
  <rect x="143" y="92" width="3.5" height="66" fill="url(#gold)"/>
  <rect x="135" y="92" width="19" height="2.5" fill="url(#gold)"/>
  <path d="M95 92 L105 92 Q122 120 149 158 L127 158 Q114 122 95 92 Z" fill="url(#gold)"/>
  <path d="M107.5 118 L122.5 118" stroke="#0b0b0c" stroke-width="1.6"/>
  <path d="M86 168 Q120 180 154 168" fill="none" stroke="url(#gold)" stroke-width="1"/>
</svg>
